spring:
  application:
    name: cobryn
  datasource:
    url: jdbc:postgresql://localhost:${PORT}/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver
  threads:
    virtual:
      enabled: true
  jpa:
    database: PostgreSQL
    hibernate:
      ddl-auto: validate
